# Font
[font]
size = 12.0

[font.normal]
family = "Iosevka Nerd Font"

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

# Cursor
[cursor]
unfocused_hollow = false

[cursor.style]
shape = "Block"
blinking = "Off"

#thickness = 1.0

# Scrolling
[scrolling]
history = 5000

# Window
[window]
decorations = "None"
opacity = 1.0
dynamic_title = true

[window.padding]
x = 8
y = 8

# Mouse
[mouse]
hide_when_typing = true

# Bell
[bell]
duration = 0
