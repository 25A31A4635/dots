[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General

[general]
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = false
# Sharp X11 apps and games on scaled outputs; they see physical resolutions.
xwayland_native_resolution = true

# ==============================================================================
# Outputs

[output.eDP-1]
mode = "1920x1200@60.026"
position = [0, 0]
scale = 1.25

# ==============================================================================
# Appearance

[appearance]
prefer_no_csd = true                       
border_width = 2                         
outer_border_width = 0
corner_radius = 0

[appearance.shadow]
enabled = true                                
softness = 10                                 
offset_x = 0                                   
offset_y = 0

[appearance.blur]
radius = 3

# ==============================================================================
# Input

[input.keyboard]
numlock_toggle = true

[input.touchpad]
natural_scroll = true
sensitivity = 0.75
disable_while_typing = true

[input.cursor]
theme = "Bibata-Original-Classic"
size = 20

# ==============================================================================
# Keybinds

[keybinds]
"Mod+O" = "overview-toggle"
"Mod+W" = "window-close"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+Ctrl+R" = "window-set-secondary-extent:1.0"
"Mod+Equal" = "window-modify-primary-extent:0.05"
"Mod+Minus" = "window-modify-primary-extent:-0.05"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.05"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.05"
"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+C" = "window-toggle-maximize-to-edges"
"Mod+V" = "window-toggle-floating"
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"
"Mod+Z" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+Z" = "spawn:noctalia msg screenshot-fullscreen"

"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"Alt+M" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"Alt+K" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"Alt+J" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"Alt+Space" = "spawn:playerctl play-pause"
"Alt+H" = "spawn:playerctl next"
"Alt+L" = "spawn:playerctl prev"
"XF86AudioPlay"       = "spawn:playerctl play-pause"
"XF86AudioNext"       = "spawn:playerctl next"
"XF86AudioPrev"       = "spawn:playerctl prev"
"XF86MonBrightnessUp" = "spawn:brightnessctl set 5%+"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 5%-"
"Alt+I" = "spawn:brightnessctl set 5%+"
"Alt+U" = "spawn:brightnessctl set 5%-"

"Mod+Shift+O" = "cheatsheet-toggle"

"Mod+Return" = "spawn:alacritty"
"Mod+Shift+Return" = "spawn:kitty"
"Mod+E" = "spawn:nautilus"
"Mod+B" = "spawn:helium-browser"
"Mod+D" = "spawn:equibop"
"Mod+P" = "spawn:localsend"
"Mod+G" = "spawn:zapfast"

"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Ctrl+Q" = "spawn:noctalia msg panel-toggle control-center network"
"Mod+Shift+Q" = "spawn:noctalia msg panel-toggle control-center weather"
"Mod+Shift+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Ctrl+W" = "spawn:noctalia msg wallpaper-random"
"Mod+T" = "spawn:noctalia msg bar-toggle"
"Alt+P" = "spawn:noctalia msg power-cycle"
"Mod+Shift+A" = "spawn:noctalia msg panel-toggle control-center audio"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Shift+S" = "spawn:noctalia msg panel-toggle control-center system"
"Mod+Ctrl+S" = "spawn:noctalia msg panel-toggle control-center screen-time"
"Mod+Shift+C" = "spawn:noctalia msg panel-toggle control-center calendar"
"Mod+Shift+V" = "spawn:noctalia msg panel-toggle clipboard"
#"Mod+Ctrl+V" = "spawn:noctalia msg clipboard-clear"
"Mod+Shift+B" = "spawn:noctalia msg panel-toggle control-center power"
"Mod+Ctrl+B" = "spawn:noctalia msg panel-toggle control-center bluetooth"
"Mod+N" = "spawn:noctalia msg notification-clear-active"
"Mod+Shift+N" = "spawn:noctalia msg panel-toggle control-center notifications"
"Mod+Ctrl+N" = "spawn:noctalia msg notification-clear-history"
"Mod+Shift+M" = "spawn:noctalia msg panel-toggle control-center media"
"Alt+N" = "spawn:noctalia msg mic-mute"
"Mod+Slash" = "spawn:noctalia msg settings-toggle"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"
"Alt+Escape" = "spawn:noctalia msg session lock"

"Mod+Shift+Backspace" = "workspace-set-layout:scrolling"
"Mod+Ctrl+Backspace" = "workspace-set-layout:dwindle"


"Mod+H" = "window-focus-left" 
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Ctrl+V" = "window-focus-switch-floating"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Ctrl+H" = "column-focus-first"
"Mod+Ctrl+L" = "column-focus-last"

"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Shift+U" = "window-move-to-workspace-next"
"Mod+Shift+I" = "window-move-to-workspace-previous"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"

# ==============================================================================
# Layout

[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Window rules

[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 800, height = 800 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[window_rule]]
match.app_id = "^xdg-desktop-portal-gtk$"
match.title = "^(Open Files|Save As|Choose Files|Confirm to replace files)$"
default_floating = true
default_floating_size_px = { width = 800, height = 800 }


# ==============================================================================
# Layer rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ==============================================================================
# Overview

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
